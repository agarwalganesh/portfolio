<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ae8cc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" rx="16" fill="#0a0f0f"/>

  <!-- G ghost fill -->
  <text x="4" y="90" font-size="96" font-weight="900"
    font-family="Arial Black, Arial, sans-serif"
    fill="url(#g)" opacity="0.13">G</text>

  <!-- G outline -->
  <text x="4" y="90" font-size="96" font-weight="900"
    font-family="Arial Black, Arial, sans-serif"
    fill="none" stroke="url(#g)" stroke-width="2">G</text>

  <!-- A layered -->
  <text x="46" y="80" font-size="56" font-weight="900"
    font-family="Arial Black, Arial, sans-serif"
    fill="url(#g)">A</text>

  <!-- Dot -->
  <circle cx="95" cy="78" r="5" fill="#1ae8cc"/>
</svg>
